# Konfiguration des SharePoint-Abgleichs.
# Zugangsdaten gehören NICHT hierher, sondern in GitHub-Secrets/-Variablen
# (AZURE_TENANT_ID, AZURE_CLIENT_ID, optional AZURE_CLIENT_SECRET).

quellen:
  # Pro Eintrag eine SharePoint-Dokumentbibliothek.

  # Team „INT-Rettungsdienst“ – per OneDrive-Verknüpfung auf dem PC (import-ordner)
  - name: rettungsdienst
    hostname: ksur.sharepoint.com
    site_pfad: /sites/INT-Rettungsdienst
    bibliothek: Dokumente
    ordner: []                              # leer = alle Kanäle, sonst z. B. ["/Allgemein"]
    # TODO: Pfad im Explorer prüfen (Ordnername „OneDrive - …“ hängt von der Organisation ab)
    lokaler_pfad: 'C:\Users\NAME\OneDrive - ORGANISATION\INT-Rettungsdienst - Dokumente'
    # TODO: prüfen, ob die Bibliothek im Link „Shared Documents“ heisst (siehe docs/ordner-import.md)
    web_basis: https://ksur.sharepoint.com/sites/INT-Rettungsdienst/Shared Documents

  - name: dls                               # Kurzname, wird Ordnername unter wissen/
    hostname: ksur.sharepoint.com
    site_pfad: /sites/DLS
    bibliothek: Dokumente                   # Standardbibliothek; Anzeigename oder URL-Name ("Shared Documents")
    ordner: []                              # leer = ganze Bibliothek, sonst z. B. ["/Richtlinien", "/Handbücher"]
    # Variante ohne App-Registrierung: per OneDrive synchronisierter Ordner auf dem PC.
    # Ist lokaler_pfad gesetzt, liest `import-ordner` diese Quelle statt `sync`.
    # lokaler_pfad: 'C:\Users\NAME\ksur\DLS - Dokumente'   # TODO: eigenen Pfad eintragen
    # web_basis: https://ksur.sharepoint.com/sites/DLS/Shared Documents  # für Links zum Original

dateitypen:                                 # nur diese Endungen werden übernommen
  - .docx
  - .pptx
  - .xlsx
  - .pdf
  - .md
  - .txt
  - .html
  - .csv

max_groesse_mb: 50                          # grössere Dateien werden übersprungen

chunks:
  max_zeichen: 1500                         # Zielgrösse eines Textabschnitts für den Chatbot
